map $uri $cache_control {
  ~^/assets/  "public, max-age=31536000, immutable";
  default     "no-store";
}

server {
  listen 8080;
  root /usr/share/nginx/html;
  server_tokens off;

  # The page talks ONLY to this server; the backend owns every external connection.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # (no add_header inside locations: it would drop the security headers above)
  add_header Cache-Control $cache_control always;

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /ws/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
  location /assets/ { try_files $uri =404; }
  location / { try_files $uri /index.html; }
}
